[project]
name = "taupin"
version = "0.1.0"
description = "Soil-insect scouting for Quebec field crops: 3D field, in-browser insect photo classifier, wireworm and corn rootworm risk from NASA soil temperature."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# The app and the risk engine use the standard library only.
dependencies = []

[project.optional-dependencies]
# `taupin classify <photo>` on the command line
classify = ["onnxruntime>=1.18", "numpy>=1.24", "pillow>=13"]
# `python -m taupin.bake` and `python -m taupin.fetch_layers`: download the rasters and soil
# polygons and turn them into web/data/ (outputs are committed)
bake = ["numpy>=1.24", "pillow>=13", "rasterio>=1.3", "pystac-client>=0.7",
        "planetary-computer>=1.0", "pyshp>=2.3"]

[project.scripts]
taupin = "taupin.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "onnx>=1.16", "onnxruntime>=1.18", "numpy>=1.24", "pillow>=13", "rasterio>=1.3",
       "pyshp>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taupin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
